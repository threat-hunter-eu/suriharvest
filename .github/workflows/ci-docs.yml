# Every `<!-- doctest -->` shell example in README.md and docs/*.md runs against an offline fixture workspace
# (tests/test_docs.py), so the docs cannot drift from the CLI. Unmarked blocks already fail the pytest job of ci.yml on
# every push. Runs on every pull request to main (docs-only ones included), daily when SURIHARVEST_FULL_CI_ENABLED is
# `true`, and on demand. docs/automation.md#what-runs-when.
name: CI (docs examples)

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '47 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: docs examples (Suricata 7)
    if: github.event_name != 'schedule' || vars.SURIHARVEST_FULL_CI_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: docker.io/jasonish/suricata:7.0.17@sha256:6f915ca62512c9859e888648765515b73b209dfa8a03a65edf1607f17e11fa51
    steps:
      - run: dnf -y -q install git-core tar gzip jq && suricata -V && test -f /etc/suricata/suricata.yaml
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6' # uv itself; bump with the action (checksum known to it)
          python-version: '3.12'
      - run: uv sync --locked
      - name: pytest -m docs (a skipped test is a failure here)
        run: |
          set -euo pipefail
          uv run pytest -q -rs -m docs tests/test_docs.py --junitxml "$RUNNER_TEMP/docs.xml"
          python3 - "$RUNNER_TEMP/docs.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          tests = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          print(f"docs tests: {tests}, skipped: {skipped}")
          if tests == 0 or skipped:
              sys.exit("docs tests were skipped or none ran")
          PY
