name: Weekly catalog health

# Checks every catalog source (URL answers, licence text unchanged, OISF index entry unchanged, new free OISF
# sources) and proposes the result in a PR that only touches src/suriharvest/catalog/health.yaml.
# It never edits sources.yaml: changing `redistribute`, `status` or `tier` is always a reviewed, manual edit.

on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: suriharvest-catalog-health
  cancel-in-progress: false

env:
  PR_BRANCH: automation/catalog-health
  CATALOG: src/suriharvest/catalog/sources.yaml
  HEALTH: src/suriharvest/catalog/health.yaml

jobs:
  # Talks to third-party servers and parses their answers: read-only token, no persisted credentials.
  check:
    if: vars.SURIHARVEST_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      attention: ${{ steps.run.outputs.attention }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6' # uv itself; bump with the action (checksum known to it)
          python-version: '3.12'
          enable-cache: false # reads third-party answers: neither restores nor saves a uv cache

      - run: uv sync --locked --no-dev

      - name: Check sources (HTTP/git reachability, licence fingerprints, OISF index diff)
        id: run
        run: |
          set -uo pipefail
          rc=0
          uv run suriharvest sources check \
            --catalog "$CATALOG" \
            --health "$HEALTH" \
            --oisf-index https://www.openinfosecfoundation.org/rules/index.yaml \
            --licences \
            --max-http-requests 300 \
            --report-file "$RUNNER_TEMP/health.md" || rc=$?
          # 0 = all fine, 1 = something needs a human (still open the PR), anything else = tool error.
          case "$rc" in
            0) echo "attention=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "attention=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::sources check failed (exit $rc)"; exit "$rc" ;;
          esac

      - name: Guard (only health.yaml changed, catalog untouched)
        run: |
          set -euo pipefail
          changed=$(git status --porcelain --untracked-files=all | awk '{print $2}')
          for f in $changed; do
            [ "$f" = "$HEALTH" ] || { echo "::error::sources check modified $f"; exit 1; }
          done
          uv run python - "$HEALTH" "$CATALOG" <<'PY'
          import sys, yaml
          health = yaml.safe_load(open(sys.argv[1], encoding="utf-8")) or {}
          names = {s["name"] for s in (yaml.safe_load(open(sys.argv[2], encoding="utf-8")) or {}).get("sources", [])}
          assert isinstance(health.get("sources"), dict), "health.yaml: `sources` must be a mapping"
          unknown = sorted(set(health["sources"]) - names)
          assert not unknown, f"health.yaml names sources that are not in the catalog: {unknown}"
          print(f"{len(health['sources'])} sources checked; {len(health.get('candidates', []))} OISF candidates")
          PY

      - id: diff
        run: |
          if [ -z "$(git status --porcelain -- "$HEALTH")" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          cat "$RUNNER_TEMP/health.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalog-health
          path: |
            ${{ env.HEALTH }}
            ${{ runner.temp }}/health.md
          if-no-files-found: error
          retention-days: 14

  pr:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      # GITHUB_TOKEN PRs do not trigger CI; set SURIHARVEST_PR_TOKEN (GitHub App / PAT) if CI must run on them.
      GH_TOKEN: ${{ secrets.SURIHARVEST_PR_TOKEN || github.token }}
      ATTENTION: ${{ needs.check.outputs.attention }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.SURIHARVEST_PR_TOKEN || github.token }}
          persist-credentials: false # the token is passed to `git push` only (last step), never left in .git/config

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: catalog-health
          path: ${{ runner.temp }}/health

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6' # uv itself; bump with the action (checksum known to it)
          python-version: '3.12'
          enable-cache: false # write-token job: no cache restored from other runs

      # PyYAML for the re-check comes from uv.lock (exact version, hash-verified); nothing unpinned from PyPI here.
      - run: uv sync --locked --no-dev --no-install-project

      # Re-check here: this job holds a write token, the artifact came from a job that read third-party answers.
      - name: Re-validate artifact
        run: |
          set -euo pipefail
          src=$(find "$RUNNER_TEMP/health" -name health.yaml | head -1)
          uv run --no-sync python -I - "$src" "$CATALOG" <<'PY'
          import re, sys, yaml
          health = yaml.safe_load(open(sys.argv[1], encoding="utf-8"))
          names = {s["name"] for s in yaml.safe_load(open(sys.argv[2], encoding="utf-8"))["sources"]}
          assert isinstance(health, dict) and isinstance(health.get("sources"), dict), "bad shape"
          assert set(health["sources"]) <= names, "unknown source names"
          allowed = {"status", "check", "http", "final_url", "licence_url", "licence_sha256", "licence_changed",
                     "oisf", "since", "attention", "rules_seen"}
          for name, h in health["sources"].items():
              assert isinstance(h, dict) and set(h) <= allowed, f"{name}: unexpected fields {set(h) - allowed}"
          for c in health.get("candidates", []):
              assert re.fullmatch(r"[A-Za-z0-9._/-]{1,120}", str(c.get("oisf_name", ""))), c
              assert str(c.get("url", "")).startswith("https://"), c
          PY
          cp "$src" "$HEALTH"
          report=$(find "$RUNNER_TEMP/health" -name health.md | head -1)
          {
            echo "Weekly catalog health run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
            echo
            echo "Only \`$HEALTH\` changes. Nothing in \`$CATALOG\` is edited by automation:"
            echo "a source whose licence text changed, that went dead, or a new OISF candidate needs a human"
            echo "to read the licence and edit \`redistribute\` / \`status\` / \`tier\` in a separate PR."
            echo
            head -c 60000 "$report" 2>/dev/null || true
          } > "$RUNNER_TEMP/body.md"

      - name: Commit, push and open/update the PR
        env:
          BASE: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$PR_BRANCH"
          git add "$HEALTH"
          git commit -q -m "catalog: weekly health $(date -u +%F)"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push --force origin "$PR_BRANCH"
          title="catalog: weekly health check"
          [ "$ATTENTION" = "true" ] && title="catalog: weekly health check (needs review)"
          base="$BASE"
          num=$(gh pr list --head "$PR_BRANCH" --state open --json number --jq '.[0].number // ""')
          if [ -n "$num" ]; then
            gh pr edit "$num" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --head "$PR_BRANCH" --base "$base" --title "$title" \
              --body-file "$RUNNER_TEMP/body.md" --label catalog || \
            gh pr create --head "$PR_BRANCH" --base "$base" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
