# suriharvest bundled source catalog. Imported from the curated catalog (research run of 2026-11-14).
# Loaded with the sources.yaml schema (see docs/sources.md). Field mapping:
#   status stale        = still served, no upstream update for more than a year: synced like active
#   min_suricata 7 | 8  = lowest Suricata major on which the rules load (init disables sources too new for the engine)
#   url_versions        = Suricata major -> value of ${suricata_version} in the URL
#   oisf_name           = the name in the OISF suricata-update index (et/open, ...) when the URL is listed there
#   licence_source, sid_range = documentation (where the licence was read; the publisher's sidallocation.org range)
#   rules, measured     = measurement snapshot, catalog only (not copied into sources.yaml)
#   enabled             = the curated default; `suriharvest init --preset/--tier` decides what a workspace enables
# The `excluded:` list at the end names sources left out on purpose; `sources check` never proposes them again.
#
# suriharvest source catalog (core tier = the default selection). Generated 2026-11-14 (measured with Suricata 7.0.3 RELEASE, /usr/bin/suricata).
# Every URL was fetched on 2026-11-14 (all answered 200); rule counts = alert|drop|reject|pass lines, enabled + '#'-disabled.
# Fields: name, type (http-tarball|http-file|git), url (${suricata_version} placeholder for ET), paths (globs of *.rules inside the
#   archive/repo; empty for http-file), licence (SPDX expression, checked against the publisher's own LICENSE/site, see licence_source),
#   redistribute (yes|no|unknown: may the rule text go into a published build), status (active|stale|dead; stale = no update > 1 year),
#   tier (core|community|experimental|user-fetch: licence or terms unclear, fetch it yourself), enabled (core tier + redistributable only), priority (lower wins on sid/logic collisions),
#   min_suricata (7|8: lowest major on which the rules load), sid_range (sidallocation.org allocation of the publisher, null = none),
#   rules (enabled + disabled), measured (snapshot), notes.
# Totals: core 85,566 rules, community 41,905, experimental 41,798, user-fetch 496 (ptrules-open, etnetera-aggressive).
# Collision policy: same (gid,sid) in two sources -> lower priority loses (dropped from the build, listed in collisions.json).
sources:
- name: et-open
  oisf_name: et/open
  type: http-tarball
  url: https://rules.emergingthreats.net/open/suricata-${suricata_version}/emerging.rules.tar.gz
  homepage: https://rules.emergingthreats.net/open/
  paths:
  - '**/*.rules'
  licence: BSD-3-Clause AND GPL-2.0-only
  licence_source: bundled rules/LICENSE + BSD-License.txt + gpl-2.0.txt
  copyright: "Copyright (c) 2003-2026, Emerging Threats"
  licence_files:
  - rules/LICENSE
  - rules/BSD-License.txt
  - rules/gpl-2.0.txt
  rule_licences:  # rules/LICENSE: GPLv2 for the old Snort GPL sids (and their "GPL ..." renumbering), BSD otherwise
  - licence: GPL-2.0-only
    sids: 1-3464, 100000000-100000908, 2100000-2103999
    msg_prefix: 'GPL '
  - licence: BSD-3-Clause
  redistribute: 'yes'
  status: active
  tier: core
  enabled: true
  priority: 10
  min_suricata: 7
  sid_range: 2000000-2103999, 2400000-2609999, 2700000-2799999, 100000000-199999999 (Emerging Threats)
  sid_namespace: et  # sidallocation.org owner of the range: keeps its sids in a clash
  rules: 72487
  measured:
    date: '2026-11-14'
    last_update: '2026-11-13'
    enabled: 52975
    disabled: 19512
    rule_files: 54
    sid_min: 2000005
    sid_max: 2527021
    dup_sid_lines: 0
    suricata_7_0_3:
      tested: 52975
      failed: 0
      pass_rate: 1.0
    suricata_7_0_3_all_incl_disabled:
      tested: 72487
      failed: 0
      pass_rate: 1.0
  notes: 'ET Open. Bundled LICENSE: sids 2,000,000-2,799,999 BSD (c) 2003-2026 Emerging Threats; sids 1-3464 and 100,000,000-100,000,908 GPLv2. In practice
    the 1,690 ''GPL ...'' rules renumbered to 2,100,000-2,103,999 are the old Snort GPLv2 rules (ET community thread 2396): ship BSD notice + GPLv2 text.
    OISF index says MIT: wrong. Per-engine URL: ${suricata_version} = 7.0.3 / 8.0 (both answered 200 on 2026-11-14). Third-party IP lists inside (ciarmy,
    dshield, compromised, botcc) carry no own licence statement. Disabled rules validated too: 72,487/72,487 load.'
  url_versions:
    '7': 7.0.3
    '8': '8.0'
